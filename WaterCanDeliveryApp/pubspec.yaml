name: water_can_delivery_app
description: A new Flutter project for Water Can Delivery App.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Libraries
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # State Management (Choose one, adding provider as default)
  provider: ^6.0.5
  flutter_svg: ^2.3.0
  http: ^1.2.0
  url_launcher: ^6.2.0
  dotted_border: ^3.1.0
  shared_preferences: ^2.5.5

  # Firebase
  firebase_core: ^2.15.1
  # firebase_auth: ^4.9.0
  # cloud_firestore: ^4.9.1
  firebase_messaging: ^14.6.7

  # Location & Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  flutter_local_notifications: ^22.3.1

  # razorpay_flutter: ^1.3.4

  # Alternative Backend (Supabase)
  # supabase_flutter: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

