<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            seller: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fff7ed;
      color: #171717;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-[#fff7ed] min-h-screen flex justify-center text-neutral-900 selection:bg-orange-200">
  <!-- Mobile Container (390px iPhone standard) -->
  <div class="w-full max-w-[420px] min-h-screen bg-[#fff7ed] flex flex-col relative px-5 pt-3 pb-8">
    
    <!-- Status Bar (iOS standard style matching Seller Dashboard) -->
    <div class="flex justify-between items-center text-xs font-semibold text-neutral-800 pt-1 pb-3 px-1">
      <span class="tracking-tight text-[13px]">9:41</span>
      <div class="flex items-center gap-1.5 text-neutral-700">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A.996.996 0 005.06 20h13.88a.996.996 0 00.71-1.75l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.55-.51 2.98-1.37 4.14L16.2 14.71a4.996 4.996 0 00-8.4 0l-1.43 1.43C5.51 14.98 5 13.55 5 12c0-3.87 3.13-7 7-7z"></path>
        </svg>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L1 21h22L12 2zm0 4.2l7.53 13H4.47L12 6.2z"></path>
        </svg>
        <div class="w-5 h-2.5 border border-neutral-700 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3 bg-neutral-800 rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Top Navigation Bar (matching Seller Dashboard with distinct tactile buttons) -->
    <div class="flex items-center justify-between gap-2 pt-1 pb-3">
      <div class="flex items-center gap-2 flex-1">
        <!-- Analytics (Active/Selected screen representation) -->
        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-orange-600 border border-orange-600 text-white rounded-xl shadow-xs font-semibold text-xs tracking-tight transition-all">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
          <span class="">Analytics</span>
        </button>

        <!-- History -->
        <button class="flex items-center gap-1.5 px-2.5 py-1.5 bg-white border border-neutral-300 text-neutral-700 rounded-xl shadow-xs text-xs font-medium tracking-tight hover:bg-neutral-50 transition-all">
          <svg class="w-3.5 h-3.5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"></path>
          </svg>
          <span class="">History</span>
        </button>

        <!-- Products -->
        <button class="flex items-center gap-1.5 px-2.5 py-1.5 bg-white border border-neutral-300 text-neutral-700 rounded-xl shadow-xs text-xs font-medium tracking-tight hover:bg-neutral-50 transition-all">
          <svg class="w-3.5 h-3.5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
          <span class="">Products</span>
        </button>
      </div>

      <!-- Seller Profile Icon -->
      <div class="relative flex-shrink-0">
        <div class="w-8 h-8 rounded-full bg-orange-100 border border-orange-300 flex items-center justify-center text-orange-700 shadow-xs">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <span class="absolute bottom-0 right-0 w-2 h-2 bg-emerald-500 border border-white rounded-full"></span>
      </div>
    </div>

    <!-- Header Section -->
    <div class="pt-2 pb-5">
      
      
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-col gap-6 flex-1">

      <!-- SECTION 1: TODAY'S ORDERS -->
      <div class="flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-neutral-600 tracking-wider uppercase">Today's Orders</h2>
          <span class="text-[11px] font-semibold text-neutral-500 bg-neutral-100 px-2 py-0.5 rounded-md">Live Count</span>
        </div>

        <!-- 3 Summary Cards Stack/Grid as specified -->
        <div class="flex flex-col gap-3"><!-- Featured Top Square/Banner Card: Today's Orders -->
<div class="bg-white rounded-2xl p-4 border-2 border-neutral-900 shadow-xs flex flex-col justify-between relative overflow-hidden">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-orange-100 border border-orange-200 flex items-center justify-center text-orange-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
      </div>
      <span class="text-xs font-bold text-neutral-600 uppercase tracking-wide">Today's Orders</span>
    </div>
    <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      +2 new
    </span>
  </div>
  <div class="flex items-baseline justify-between">
    <span class="text-4xl font-black text-neutral-900 tracking-tight">5</span>
    <span class="text-xs text-neutral-500 font-medium">Total received today</span>
  </div>
</div>

<!-- 2-Column Square Grid: Completed & Pending -->
<div class="grid grid-cols-2 gap-3">
  <!-- Completed Card (Square) -->
  <div class="bg-emerald-50/60 rounded-2xl p-3.5 border-2 border-neutral-900 shadow-xs flex flex-col justify-between aspect-square">
    <div class="flex items-center justify-between">
      <div class="w-7 h-7 rounded-lg bg-emerald-100 border border-emerald-300 flex items-center justify-center text-emerald-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-100/80 px-1.5 py-0.5 rounded">Delivered</span>
    </div>
    <div>
      <div class="text-3xl font-black text-neutral-900 tracking-tight">1</div>
      <div class="text-xs font-bold text-emerald-800 uppercase tracking-wide mt-0.5">Completed</div>
      <div class="text-[11px] text-neutral-500 font-medium leading-tight mt-0.5">Delivered successfully</div>
    </div>
  </div>

  <!-- Pending Card (Square) -->
  <div class="bg-amber-50/60 rounded-2xl p-3.5 border-2 border-neutral-900 shadow-xs flex flex-col justify-between aspect-square">
    <div class="flex items-center justify-between">
      <div class="w-7 h-7 rounded-lg bg-amber-100 border border-amber-300 flex items-center justify-center text-amber-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"></circle>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2"></path>
        </svg>
      </div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-100/80 px-1.5 py-0.5 rounded">In Action</span>
    </div>
    <div>
      <div class="text-3xl font-black text-neutral-900 tracking-tight">4</div>
      <div class="text-xs font-bold text-amber-800 uppercase tracking-wide mt-0.5">Pending</div>
      <div class="text-[11px] text-neutral-500 font-medium leading-tight mt-0.5">In progress &amp; accepted</div>
    </div>
  </div>
</div></div>
      </div>

      <!-- SECTION 2: MONTHLY ORDERS -->
      <div class="flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-neutral-600 tracking-wider uppercase">Monthly Orders</h2>
          <span class="text-[11px] font-semibold text-orange-700 bg-orange-100 px-2 py-0.5 rounded-md">Current Month</span>
        </div>

        <!-- Monthly Orders Card -->
        <div class="bg-white rounded-2xl p-4 border-2 border-neutral-900 shadow-xs relative overflow-hidden">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-orange-600 flex items-center justify-center text-white shadow-xs">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </div>
      <div>
        <span class="text-xs font-bold text-neutral-800 uppercase tracking-wide block">Monthly Orders</span>
        <span class="text-[11px] text-neutral-500 font-medium">Total accumulated orders</span>
      </div>
    </div>
    <span class="text-[11px] font-semibold text-neutral-600 bg-neutral-100 px-2 py-0.5 rounded-md border border-neutral-200">30 Days</span>
  </div>
  <div class="flex items-center justify-between pt-2 border-t border-neutral-100">
    <div class="flex items-baseline gap-1.5">
      <span class="text-4xl font-black text-orange-600 tracking-tight">42</span>
      <span class="text-xs font-semibold text-neutral-500">orders total</span>
    </div>
    <div class="flex items-center gap-1 text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
      </svg>
      <span class="">Growth</span>
    </div>
  </div>
</div>
      </div>

    </div>

    <!-- Bottom Indicator / Home Bar -->
    <div class="w-32 h-1 bg-neutral-300 rounded-full mx-auto mt-6"></div>

  </div>




</body></html>
