<!DOCTYPE html>
<html class="h-full" lang="en" style="">

<head>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#ffb3b6", "on-tertiary": "#ffffff", "tertiary-fixed": "#ffdada", "on-primary-container": "#cfd4ff", "on-background": "#0b1c30", "background": "#f8f9ff", "on-primary": "#ffffff", "on-surface": "#0b1c30", "on-error": "#ffffff", "outline": "#747687", "on-tertiary-fixed": "#40000c", "on-secondary": "#ffffff", "secondary-fixed": "#9cf2e8", "primary": "#002dc7", "secondary-fixed-dim": "#80d5cb", "error-container": "#ffdad6", "on-secondary-fixed-variant": "#00504a", "on-secondary-container": "#006f67", "on-tertiary-container": "#ffcacb", "tertiary": "#900027", "error": "#ba1a1a", "primary-fixed": "#dee0ff", "surface-container-highest": "#d3e4fe", "on-primary-fixed-variant": "#002ecb", "surface-bright": "#f8f9ff", "secondary-container": "#99efe5", "on-tertiary-fixed-variant": "#920028", "inverse-on-surface": "#eaf1ff", "surface-container-lowest": "#ffffff", "surface-tint": "#2749ec", "surface-container-high": "#dce9ff", "surface-container": "#e5eeff", "inverse-primary": "#bac3ff", "secondary": "#006a63", "on-error-container": "#93000a", "primary-container": "#2547eb", "on-surface-variant": "#444656", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#bac3ff", "inverse-surface": "#213145", "surface": "#f8f9ff", "on-primary-fixed": "#000f5c", "on-secondary-fixed": "#00201d", "surface-variant": "#d3e4fe", "outline-variant": "#c4c5d9", "tertiary-container": "#bc0036", "surface-container-low": "#eff4ff" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-2xl": "2rem", "card-padding-mobile": "1.25rem", "space-sm": "0.75rem", "input-height": "3.25rem", "space-lg": "1.25rem", "space-2xs": "0.25rem", "otp-cell-width": "3rem", "space-md": "1rem", "space-xl": "1.5rem", "space-xs": "0.5rem", "otp-cell-height": "3.5rem", "screen-margin-mobile": "1rem" }, "fontFamily": { "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, "fontSize": { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "label-lg": ["15px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "headline-lg": ["30px", { "lineHeight": "38px", "fontWeight": "700" }] } } } }</script>
    <style>
        @layer base {

            html,
            body {
                width: 100%;
                margin: 0;
                padding: 0;
                min-height: 100%;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body
    class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-center items-center">
    <main
        class="w-full max-w-[420px] mx-auto min-h-screen flex flex-col bg-background relative overflow-hidden pb-safe justify-center">
        <div
            class="absolute top-0 left-0 right-0 w-full h-52 overflow-hidden flex items-center justify-center pointer-events-none">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVtOSL7yYRX4hoG4qDjmkvSKeeV311xaCwZH1rZ3kdOECjPqkq560nIY_Tm0QP9nxK9vOxTPRkAVD1IfUFOoWgDOhMdWlOv8lAiKSrmcNUFnRd7oBDIxw8RP5PbIG8c6TPMxn09b1F5KaDxU6Bbbfb9GAQpV-nSoP9bbQjkmiqnwM6Ap7TUabTnMBQk7BXoFEWPdqNPSgsSqF0G_raf5WV4M5iLepTtkTGyEUZs12goue3c3upy922Bcbtz3wM6yb8ag"
                alt="Water Banner" class="w-full h-full object-cover opacity-75">
            <div class="absolute inset-0 bg-gradient-to-b from-primary/10 via-transparent to-background"></div>
        </div>
        <div class="flex flex-col w-full px-screen-margin-mobile relative z-10 my-auto">
            <div
                class="w-full bg-surface-container-lowest rounded-xl shadow-md p-card-padding-mobile flex flex-col items-center">
                <div
                    class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center shadow-md mb-space-sm text-on-primary">
                    <span class="material-symbols-outlined text-[28px]">lock</span>
                </div>
                <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight"
                    style="margin-bottom: 2rem;">LOGIN</h1>
                <div class="hidden mb-space-md p-space-sm rounded-lg transition-all duration-200 flex items-center gap-space-xs w-full"
                    id="status-banner"><span class="material-symbols-outlined text-[20px]" id="status-icon"></span><span
                        class="font-body-sm text-body-sm flex-1" id="status-text"></span></div>
                <form class="flex flex-col space-y-space-md w-full" id="login-form" novalidate=""
                    onsubmit="return false;">
                    <div class="flex flex-col space-y-space-2xs"><label
                            class="font-label-md text-label-md text-on-surface" for="identifier">Phone Number /
                            Email</label>
                        <div class="relative w-full">
                            <div
                                class="absolute inset-y-0 left-0 pl-space-sm flex items-center pointer-events-none text-on-surface-variant">
                                <span class="material-symbols-outlined text-[20px]">account_circle</span>
                            </div><input autocomplete="username"
                                class="w-full h-input-height pl-10 pr-space-md bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest shadow-sm placeholder:text-outline transition-colors"
                                id="identifier" placeholder="Enter Phone Number / Email" type="text">
                        </div><span class="hidden font-body-sm text-body-sm text-tertiary mt-1 flex items-center gap-1"
                            id="identifier-error"><span class="material-symbols-outlined text-[16px]">info</span><span
                                class="">Please enter a valid phone number or email address</span></span>
                    </div>
                    <div class="flex flex-col space-y-space-2xs"><label
                            class="font-label-md text-label-md text-on-surface" for="password">Password</label>
                        <div class="relative w-full">
                            <div
                                class="absolute inset-y-0 left-0 pl-space-sm flex items-center pointer-events-none text-on-surface-variant">
                                <span class="material-symbols-outlined text-[20px]">key</span>
                            </div><input autocomplete="current-password"
                                class="w-full h-input-height pl-10 pr-12 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest shadow-sm placeholder:text-outline transition-colors"
                                id="password" placeholder="Enter Password" type="password"><button
                                aria-label="Toggle password visibility"
                                class="absolute inset-y-0 right-0 pr-space-sm flex items-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform"
                                id="toggle-password" type="button"><span class="material-symbols-outlined text-[22px]"
                                    id="eye-icon">visibility_off</span></button>
                        </div><span class="hidden font-body-sm text-body-sm text-tertiary mt-1 flex items-center gap-1"
                            id="password-error"><span class="material-symbols-outlined text-[16px]">info</span><span
                                class="">Password must be at least 6 characters</span></span>
                    </div>
                    <div class="pt-space-xs"><button
                            class="w-full h-input-height bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs"
                            id="submit-btn" type="submit"><span class="">LOGIN</span><span
                                class="material-symbols-outlined text-[18px]">arrow_forward</span></button></div>
                </form>
                <div class="w-full mt-space-md pt-space-xs flex items-center justify-center text-center">
                    <p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a href="#"
                            class="font-label-md text-primary hover:underline transition-colors">Register</a></p>
                </div>
            </div>
        </div>
        <div
            class="absolute bottom-0 left-0 right-0 w-full h-44 overflow-hidden flex items-end justify-center pointer-events-none">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP5rVrXr1yWQfFQ6gGvv4OHf8ZyvrWIr8fURTAtR_R6dfT1oMt-10u8vGbqIaNmrCLFV9AW4XTYPUuVtx9wfrXQt9VHROkAp4YeJHjeh6TYpx5EVEvJOGm9EKxdBruSZa8PU6sI-uQvTZ2V9Eysm21Vi9RLXmJNFJYVxBmpsY-WTI_dcFYtnJYaKSo0ArFlyJYfYfxVuLgTocYvAbZbFkNmVZ-BFrc1QyqtyKC2oKWGr5NSxMZtdZRna9K3Z3sOr075A"
                alt="Water Wave Bottom Banner" class="w-full h-full object-cover opacity-75">
            <div class="absolute inset-0 bg-gradient-to-b from-background via-transparent to-primary/10"></div>
        </div>
    </main>





</body>

</html>
