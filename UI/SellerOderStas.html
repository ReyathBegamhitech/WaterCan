<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            seller: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#fff8f2] text-slate-900 min-h-screen flex justify-center items-start antialiased p-0 sm:p-4">
  <!-- Mobile Screen Container (iOS mobile viewport frame: max-w-sm / ~390px) -->
  <div class="w-full max-w-[390px] min-h-screen bg-[#fff8f2] flex flex-col justify-between shadow-2xl relative sm:rounded-[36px] overflow-hidden border border-orange-100/80">
    
    <!-- Top Status Bar Area -->
    <div class="w-full pt-3 px-6 flex justify-between items-center text-xs font-semibold text-slate-800 select-none">
      <span class="">9:41</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
        <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
          <div class="w-full h-full bg-slate-800 rounded-xs"></div>
        </div>
      </div>
    </div>

    <!-- Screen Content Scroll Area -->
    <div class="flex-1 px-5 pt-3 pb-6 flex flex-col">
      
      <!-- ==================================================
           HEADER
           ================================================== -->
      <header class="py-2.5 mb-3 border-b border-orange-200/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="#" onclick="window.history.back(); return false;" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition-transform shadow-xs" title="Back">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
            </svg>
          </a>
          <div>
            <span class="text-[11px] font-bold tracking-wider uppercase text-seller-600">SELLER MODULE</span>
            <h1 class="text-xl font-extrabold tracking-tight text-slate-900 leading-none">ORDER STATUS</h1>
          </div>
        </div>
        <div class="px-2.5 py-1 rounded-full bg-orange-100 text-orange-800 text-[11px] font-bold uppercase tracking-wider border border-orange-200">
          Live Sync
        </div>
      </header>

      <!-- ==================================================
           ORDER INFORMATION CARD
           ================================================== -->
      <section class="mb-5"><div class="bg-white rounded-2xl p-4 sm:p-5 border-2 border-neutral-900 shadow-sm transition-all duration-200"><div class="flex items-center justify-between gap-2 mb-3 pb-2.5 border-b border-neutral-100"><div class="flex items-center gap-2"><div class="flex items-center gap-1.5 px-3 py-1 bg-[#f5ebe0] text-[#5c4033] rounded-lg font-bold text-xs tracking-wider border border-[#e8d5c4] shadow-xs"><svg class="w-3.5 h-3.5 fill-current opacity-80" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1.581.814L12 15.197l-2.419 1.617A1 1 0 018 16V4zm2 1v10.197l1.581-1.054a1 1 0 011.162 0L10 14.803l1.257-.84a1 1 0 011.162 0L14 15.197V5H6z" clip-rule="evenodd"></path></svg><span class="">#1024</span></div><span class="text-xs text-neutral-400 font-medium">10:30 AM</span></div><div class="flex items-center gap-1.5"><span id="currentStatusBadge" class="px-3 py-1 rounded-full text-xs font-semibold tracking-wide bg-amber-50 text-amber-700 border border-amber-200/70">Accepted</span><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8lZlUqPjtMr3x4_7ilGQXbTiEbhlik9_YeHdf11m-f0SoOuM31IxZhev3xy07gk4UaZK3RjvABrhUPZi1siE9qTPj3Efex0w0A9rDKdB6-xwOeiTkM45bPvg0FRn4hhROlTQv5oKQxFCskm2eUaE4Grwe2MkM1f9luj3fE8ZkSBT0VwzyWRsAhmOZosQ9hSejlz32JxOujjLTWDiLBhoi8Yhsgi8V34WvgYkX6Ld5wOAqkYP6Ch-Q8rPBblDHFGMbbjo" alt="Expand" class="w-4 h-4 opacity-40"></div></div><div class="space-y-2.5 mb-3.5"><div class="flex items-center justify-between text-xs"><div class="flex items-center gap-1.5 text-neutral-500"><span class="font-medium">Buyer:</span><span class="font-bold text-neutral-900 text-sm sm:text-base">Rajesh Kumar</span></div><a href="tel:+919845123091" class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 bg-amber-50/80 text-neutral-800 rounded-md border border-amber-200/60 hover:bg-amber-100 transition-colors"><svg class="w-3.5 h-3.5 text-[#ff5722] fill-current" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.05 15.05 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1.01A11.36 11.36 0 0 1 8.57 3.99c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.61c0-.55-.45-1-1-1z"></path></svg>+91 98451 23091</a></div><div class="flex items-center justify-between text-xs pt-1 border-t border-dashed border-neutral-200"><div class="flex items-center gap-1.5 text-neutral-500"><span class="font-medium">Qty:</span><span class="font-bold text-neutral-900 text-sm">3 Cans (20L)</span></div><div class="flex items-center gap-2"><span class="text-[11px] text-neutral-400">₹80/can</span><span class="font-bold text-base text-[#d94814]">₹240</span></div></div></div><div class="pt-2.5 border-t border-neutral-100"><div class="flex items-center justify-between text-[11px] text-neutral-500 font-semibold mb-2"><span class="">Order progress:</span></div><div class="grid grid-cols-4 gap-1 items-start relative"><div class="flex flex-col items-center text-center group"><div class="relative flex items-center justify-center w-full mb-1.5"><div class="absolute left-1/2 right-0 top-1/2 h-0.5 bg-[#ea580c] -translate-y-1/2 z-0"></div><div class="w-3.5 h-3.5 rounded-full bg-[#ea580c] border-2 border-white shadow-xs z-10 flex items-center justify-center"><div class="w-1 h-1 rounded-full bg-white"></div></div></div><span class="text-[10px] font-bold text-neutral-800 leading-tight">Placed</span></div><div class="flex flex-col items-center text-center group"><div class="relative flex items-center justify-center w-full mb-1.5"><div class="absolute left-0 right-1/2 top-1/2 h-0.5 bg-[#ea580c] -translate-y-1/2 z-0"></div><div class="absolute left-1/2 right-0 top-1/2 h-0.5 bg-neutral-200 -translate-y-1/2 z-0"></div><div class="w-4 h-4 rounded-full bg-amber-100 border-2 border-[#ea580c] shadow-xs z-10 flex items-center justify-center"><div class="w-1.5 h-1.5 rounded-full bg-[#ea580c]"></div></div></div><span class="text-[10px] font-bold text-[#ea580c] leading-tight">Accepted</span></div><div class="flex flex-col items-center text-center group"><div class="relative flex items-center justify-center w-full mb-1.5"><div class="absolute left-0 right-1/2 top-1/2 h-0.5 bg-neutral-200 -translate-y-1/2 z-0"></div><div class="absolute left-1/2 right-0 top-1/2 h-0.5 bg-neutral-200 -translate-y-1/2 z-0"></div><div class="w-3.5 h-3.5 rounded-full bg-neutral-200 border-2 border-white z-10"></div></div><span class="text-[10px] font-medium text-neutral-400 leading-tight">Preparing</span></div><div class="flex flex-col items-center text-center group"><div class="relative flex items-center justify-center w-full mb-1.5"><div class="absolute left-0 right-1/2 top-1/2 h-0.5 bg-neutral-200 -translate-y-1/2 z-0"></div><div class="w-3.5 h-3.5 rounded-full bg-neutral-200 border-2 border-white z-10"></div></div><span class="text-[10px] font-medium text-neutral-400 leading-tight">Delivered</span></div></div></div></div></section>

      <!-- ==================================================
           UPDATE ORDER STATUS
           ================================================== -->
      <section class="flex-1 flex flex-col mb-4">
        <div class="flex items-center justify-between mb-2.5">
          <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700">UPDATE ORDER STATUS</h2>
          <span class="text-[11px] text-slate-500 font-medium">Select status</span>
        </div>

        <!-- Vertical selectable radio-style status list -->
        <!-- Available statuses: Order Placed, Accepted, Preparing, Out for Delivery, Delivered, Cancelled -->
        <div class="space-y-2.5" id="statusRadioGroup" role="group" aria-label="Update Order Status">
          <!-- Option 1: Order Placed -->
          <label class="status-option group relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs cursor-pointer transition-all duration-150 hover:border-seller-300">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center radio-circle transition-colors">
                <svg class="w-3.5 h-3.5 text-white radio-dot transition-all scale-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-800 status-label">Order Placed</span>
                <span class="block text-[11px] text-slate-400 font-normal">Order received from buyer</span>
              </div>
            </div>
            <input type="checkbox" name="orderStatus" value="Order Placed" class="sr-only">
          </label>

          <!-- Option 2: Accepted -->
          

          <!-- Option 3: Preparing -->
          <label class="status-option group relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs cursor-pointer transition-all duration-150 hover:border-seller-300">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center radio-circle transition-colors">
                <svg class="w-3.5 h-3.5 text-white radio-dot transition-all scale-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-800 status-label">Preparing</span>
                <span class="block text-[11px] text-slate-400 font-normal">Cleaning &amp; filling 20L cans</span>
              </div>
            </div>
            <input type="checkbox" name="orderStatus" value="Preparing" class="sr-only">
          </label>

          <!-- Option 4: Out for Delivery -->
          <label class="status-option group relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs cursor-pointer transition-all duration-150 hover:border-seller-300">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center radio-circle transition-colors">
                <svg class="w-3.5 h-3.5 text-white radio-dot transition-all scale-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-800 status-label">Out for Delivery</span>
                <span class="block text-[11px] text-slate-400 font-normal">Dispatched with delivery agent</span>
              </div>
            </div>
            <input type="checkbox" name="orderStatus" value="Out for Delivery" class="sr-only">
          </label>

          <!-- Option 5: Delivered -->
          <label class="status-option group relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs cursor-pointer transition-all duration-150 hover:border-seller-300">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center radio-circle transition-colors">
                <svg class="w-3.5 h-3.5 text-white radio-dot transition-all scale-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-800 status-label">Delivered</span>
                <span class="block text-[11px] text-slate-400 font-normal">Handed over to Rajesh Kumar</span>
              </div>
            </div>
            <input type="checkbox" name="orderStatus" value="Delivered" class="sr-only">
          </label>

          <!-- Option 6: Cancelled -->
          <label class="status-option group relative flex items-center justify-between p-3.5 rounded-xl border border-slate-200 bg-white shadow-2xs cursor-pointer transition-all duration-150 hover:border-red-300">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center radio-circle transition-colors">
                <svg class="w-3.5 h-3.5 text-white radio-dot transition-all scale-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-800 status-label">Cancelled</span>
                <span class="block text-[11px] text-slate-400 font-normal">Order terminated</span>
              </div>
            </div>
            <input type="checkbox" name="orderStatus" value="Cancelled" class="sr-only">
          </label>
        </div>
      </section>

      <!-- Feedback Toast Notification (Hidden by default) -->
      <div id="toast" class="hidden mb-3 p-3 bg-emerald-700 text-white text-xs font-semibold rounded-xl flex items-center justify-between shadow-md transition-all">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-emerald-200" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
          <span id="toastMessage" class="">Order #1024 updated to Accepted</span>
        </div>
        <button onclick="document.getElementById('toast').classList.add('hidden')" class="text-emerald-200 hover:text-white">×</button>
      </div>

      <!-- ==================================================
           UPDATE STATUS BUTTON
           ================================================== -->
      <div class="mt-auto pt-2">
        <button id="updateStatusBtn" type="button" class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-seller-500 to-seller-600 hover:from-seller-600 hover:to-seller-700 active:scale-[0.98] text-white font-extrabold text-base tracking-wider uppercase shadow-lg shadow-orange-500/25 flex items-center justify-center gap-2 transition-all">
          <span class="">UPDATE STATUS</span>
          
        </button>
      </div>

    </div>

    <!-- iOS Home Indicator -->
    <div class="w-full py-2 flex justify-center items-center select-none bg-transparent">
      <div class="w-32 h-1 bg-slate-400/50 rounded-full"></div>
    </div>

  </div>

  <script>
    // Radio selection interactive handling
    const options = document.querySelectorAll('.status-option');
    const updateBtn = document.getElementById('updateStatusBtn');
    const statusBadge = document.getElementById('currentStatusBadge');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMessage');

    options.forEach(opt => {
      opt.addEventListener('click', () => {
        const input = opt.querySelector('input[type="radio"]');
        if (!input) return;

        // Reset all options
        options.forEach(o => {
          o.classList.remove('border-2', 'border-seller-500', 'bg-orange-50/70', 'active-selected');
          o.classList.add('border', 'border-slate-200', 'bg-white');
          
          const circle = o.querySelector('.radio-circle');
          const dot = o.querySelector('.radio-dot');
          const label = o.querySelector('.status-label');
          
          circle.classList.remove('border-seller-600');
          circle.classList.add('border-slate-300');
          
          dot.classList.remove('bg-seller-600', 'scale-100');
          dot.classList.add('bg-transparent', 'scale-0');

          label.classList.remove('text-seller-900');
          label.classList.add('text-slate-800');

          const radio = o.querySelector('input[type="radio"]');
          radio.checked = false;
        });

        // Activate selected option
        input.checked = true;
        opt.classList.remove('border', 'border-slate-200', 'bg-white');
        opt.classList.add('border-2', 'border-seller-500', 'bg-orange-50/70', 'active-selected');

        const activeCircle = opt.querySelector('.radio-circle');
        const activeDot = opt.querySelector('.radio-dot');
        const activeLabel = opt.querySelector('.status-label');

        activeCircle.classList.remove('border-slate-300');
        activeCircle.classList.add('border-seller-600');

        activeDot.classList.remove('bg-transparent', 'scale-0');
        activeDot.classList.add('bg-seller-600', 'scale-100');

        activeLabel.classList.remove('text-slate-800');
        activeLabel.classList.add('text-seller-900');
      });
    });

    // Update status button action
    updateBtn.addEventListener('click', () => {
      const selected = document.querySelector('input[name="orderStatus"]:checked');
      if (selected) {
        statusBadge.textContent = selected.value;
        toastMsg.textContent = `Order #1024 updated to "${selected.value}"`;
        toast.classList.remove('hidden');
        
        // Animate button tap
        updateBtn.classList.add('ring-4', 'ring-orange-300');
        setTimeout(() => {
          updateBtn.classList.remove('ring-4', 'ring-orange-300');
        }, 300);
      }
    });
  </script>




</body></html>
